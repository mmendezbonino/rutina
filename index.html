<style>
/* Layout: app móvil nativa — título grande, listas agrupadas, tabla de series tipo planilla, barra inferior con íconos. Oscuro primero. */
:root{
  --bg:#0c0e12; --surface:#15181e; --surface-2:#1d2129; --surface-3:#262b35; --line:#272c36;
  --fg:#f1f3f6; --fg-2:#a3abb8; --fg-3:#6c7584;
  --accent:#4d7cff; --accent-soft:rgba(77,124,255,.16); --on-accent:#ffffff;
  --ok:#34c47c; --ok-soft:rgba(52,196,124,.16); --danger:#ff6259;
  --c-espalda:#4d7cff; --c-pecho:#ff6259; --c-piernas:#34c47c;
  --floor:#1a1e25; --mach:#4a5260; --metal:#8a93a1; --pad:#2a3039; --muscle:#ff4a3d; --stage-a:#1f242d; --stage-b:#111419;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f3f6; --surface:#ffffff; --surface-2:#f0f2f5; --surface-3:#e5e8ee; --line:#e3e6ec;
  --fg:#11141a; --fg-2:#5a6372; --fg-3:#8d95a3;
  --accent:#2457e6; --accent-soft:rgba(36,87,230,.10); --on-accent:#ffffff;
  --ok:#14965a; --ok-soft:rgba(20,150,90,.12); --danger:#d93a31;
  --c-espalda:#2457e6; --c-pecho:#d93a31; --c-piernas:#14965a; --floor:#e6e9ee; --mach:#5b6472; --metal:#9aa3b0; --pad:#3a414c; --muscle:#e5392f; --stage-a:#ffffff; --stage-b:#e4e8ee; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f3f6; --surface:#ffffff; --surface-2:#f0f2f5; --surface-3:#e5e8ee; --line:#e3e6ec;
  --fg:#11141a; --fg-2:#5a6372; --fg-3:#8d95a3;
  --accent:#2457e6; --accent-soft:rgba(36,87,230,.10); --on-accent:#ffffff;
  --ok:#14965a; --ok-soft:rgba(20,150,90,.12); --danger:#d93a31;
  --c-espalda:#2457e6; --c-pecho:#d93a31; --c-piernas:#14965a; --floor:#e6e9ee; --mach:#5b6472; --metal:#9aa3b0; --pad:#3a414c; --muscle:#e5392f; --stage-a:#ffffff; --stage-b:#e4e8ee; color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.4 var(--font);margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 132px;display:flex;flex-direction:column;gap:20px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin:0}
.over{font-size:.8rem;font-weight:600;color:var(--fg-3)}
.sub{color:var(--fg-2);font-size:.9rem;margin-top:4px}
.muted{color:var(--fg-2)}
.section{display:flex;flex-direction:column;gap:8px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;padding-inline:4px}
.section-h span{font-size:.8rem;color:var(--fg-3);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:.95rem;background:var(--surface-2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%;height:54px;font-size:1.02rem;border-radius:14px}
.btn.sm{height:34px;padding:0 12px;font-size:.85rem;border-radius:10px}
.btn.text{background:none;color:var(--accent);padding:0 6px}
.btn.danger{color:var(--danger)}
.btn.ok{background:var(--ok);color:#fff}

/* segmented day picker */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--fg-2);font-weight:600;font-size:.9rem;border:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* grouped list */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:64px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--line)}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.95rem;flex:none}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:.83rem;color:var(--fg-2);margin-top:2px}
.row-sub b{color:var(--fg);font-weight:600}
.badge{font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap;flex:none}
.badge.up{background:var(--ok-soft);color:var(--ok)}
.chev{color:var(--fg-3);flex:none}
.ftile{width:52px;height:52px;border-radius:14px;flex:none;position:relative;display:grid;place-items:center}
.ftile.lg{width:64px;height:64px;border-radius:16px}
.fig{width:84%;height:84%}
.fnum{position:absolute;top:-5px;left:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--surface);border:2px solid var(--surface);font-size:.7rem;font-weight:800;display:grid;place-items:center;color:var(--fg-2)}
.ex .fnum{background:var(--surface);}
.vid{width:36px;height:36px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);display:grid;place-items:center;flex:none;text-decoration:none}
.vlink{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:.8rem;font-weight:700;color:var(--accent);text-decoration:none}
.row:has(.ftile)::before{left:84px}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-radius:var(--r)}
.strip div{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.strip div+div{border-left:1px solid var(--line)}
.strip b{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.strip span{font-size:.75rem;color:var(--fg-3);font-weight:600}

.note{font-size:.82rem;color:var(--fg-3);padding-inline:4px}

/* workout */
.wbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.wbar .clock{font-weight:700;font-size:1.05rem}
.wbar .prog{font-size:.8rem;color:var(--fg-3);font-weight:600}
.pbar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.ex{background:var(--surface);border-radius:var(--r);padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;align-items:center;gap:12px}
.ex-h .row-main .row-title{white-space:normal}
.tbl{display:grid;grid-template-columns:34px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px 8px;align-items:center}
.tbl .th{font-size:.7rem;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.tbl .th:nth-child(2){text-align:left}
.tbl .n{font-weight:700;text-align:center;color:var(--fg-2)}
.tbl .prev{font-size:.82rem;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl input{width:100%;min-width:0;height:40px;border:0;border-radius:10px;background:var(--surface-2);color:var(--fg);text-align:center;font:700 1rem var(--font);font-variant-numeric:tabular-nums}
.tbl input::placeholder{color:var(--fg-3);font-weight:600}
.tbl .done input{background:var(--ok-soft)}
.tbl .done .n{color:var(--ok)}
.chk{width:44px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg-3)}
.chk[aria-pressed="true"]{background:var(--ok);color:#fff}
.tbl>div{display:contents}
.ex-foot{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.cardio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.75rem;font-weight:600;color:var(--fg-3)}
.field input,.field select{font:600 .95rem var(--font);height:42px;padding:0 12px;border:0;border-radius:10px;background:var(--surface-2);color:var(--fg);width:100%;min-width:0}
.cardio input{text-align:center}

/* timer sheet */
.timer{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding-inline:12px;pointer-events:none}
.timer-in{pointer-events:auto;max-width:536px;width:100%;background:var(--surface-3);border-radius:18px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.timer-l{flex:1;min-width:0}
.timer-l span{font-size:.75rem;color:var(--fg-2);font-weight:600}
.timer-time{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1}
.timer-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:8px}
.timer-bar i{display:block;height:100%;background:var(--accent)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs>div{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;color:var(--fg-3);font-size:.72rem;font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* history */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-3);font:600 11px var(--font)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kv{display:flex;gap:24px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv b{font-size:1.15rem;font-weight:800}
.kv span{font-size:.75rem;color:var(--fg-3);font-weight:600}
.detail{padding:0 16px 14px 66px;display:flex;flex-direction:column;gap:10px}
.detail .t{font-weight:600;font-size:.9rem}
.detail .s{font-size:.84rem;color:var(--fg-2)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);padding:12px;border-radius:12px;font-size:.9rem}
.empty{background:var(--surface);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{color:var(--fg-3)}

/* editor */
.ed{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.ed-h{display:flex;align-items:center;gap:10px}
.ed-h input{flex:1;min-width:0;font:700 1rem var(--font);height:40px;border:0;border-radius:10px;background:var(--surface-2);color:var(--fg);padding:0 12px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg-2);flex:none}
.icon-btn.danger{color:var(--danger)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid4 input{text-align:center}
.sched .row{min-height:52px}
.sched select{font:600 .9rem var(--font);border:0;background:var(--surface-2);color:var(--fg);height:36px;border-radius:10px;padding:0 10px;max-width:60%}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:9;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{font-size:1.25rem;font-weight:800;letter-spacing:-.015em;margin-top:2px}
.sheet-stage{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:18px;overflow:hidden;background:radial-gradient(110% 80% at 50% 25%,var(--stage-a),var(--stage-b))}
.sheet-stage canvas{display:block;width:100%;height:100%}
.sheet-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg-2);font-size:.9rem}
.sheet-info{display:flex;flex-direction:column;gap:8px}
.sheet-info .tags{display:flex;gap:6px;flex-wrap:wrap}
.sheet-info .tag{font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--muscle) 16%,transparent);color:var(--muscle)}
.sheet-info .tag.b{background:var(--surface-2);color:var(--fg-2)}
.sheet-info p{margin:0;color:var(--fg-2);font-size:.9rem}
.sheet-info ol{margin:0;padding-left:1.1em;color:var(--fg-2);font-size:.88rem;display:flex;flex-direction:column;gap:4px}
button.vlink{background:none;padding:0;cursor:pointer}
a.btn{text-decoration:none}
</style>

<div class="app" id="app"><div class="empty">Cargando…</div></div>

<script>
(() => {
const COLORS = {espalda:'var(--c-espalda)', pecho:'var(--c-pecho)', piernas:'var(--c-piernas)'};
const DAYNAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const IC = {
  check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  heart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>',
  bar:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>'
};
let uidc = 0; const uid = p => (p||'x') + Date.now().toString(36) + (uidc++).toString(36);

const DEFAULT = {
  routines: {
    espalda: {name:'Espalda · hombro · bíceps', color:'espalda', exercises:[
      {id:'dom',name:'Dominadas (agarre abierto)',type:'fuerza',sets:4,reps:'6-10',weight:0,rest:150},
      {id:'remov',name:'Remo sentado con V (polea)',type:'fuerza',sets:3,reps:'10-12',weight:45,rest:120},
      {id:'rdelt',name:'Rear delt fly (polea)',type:'fuerza',sets:3,reps:'15',weight:30,rest:75},
      {id:'lat1',name:'Elevaciones laterales',type:'fuerza',sets:3,reps:'15',weight:10,rest:75},
      {id:'pred',name:'Curl predicador barra EZ',type:'fuerza',sets:3,reps:'10-12',weight:20,rest:90},
      {id:'mart',name:'Curl martillo sentado',type:'fuerza',sets:3,reps:'10-12',weight:14,rest:90}
    ]},
    pecho: {name:'Pecho · tríceps', color:'pecho', exercises:[
      {id:'banca',name:'Press banca con barra',type:'fuerza',sets:4,reps:'8-11',weight:60,rest:150},
      {id:'incl',name:'Press inclinado mancuernas',type:'fuerza',sets:3,reps:'10-12',weight:20,rest:120},

const LS = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
async function makeStore(){
  let db=null, u=null, id=null;
  try{
    if(window.claude && window.claude.use){
      [db,u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(u) id = await u.id();
    }
  }catch(e){}
  if(db && id){
    const prof = db.doc('data/users/'+id+'/profile');
    const sess = prof.collection('sessions');
    return {cloud:true,
      async loadPlan(){const s=await prof.get(); return s.exists && s.data().routines ? JSON.parse(JSON.stringify(s.data())) : null},
      async savePlan(p){await prof.set({routines:p.routines, schedule:p.schedule, planVersion:p.planVersion||1})},
      async loadSessions(){const q=await sess.orderBy('date','desc').limit(400).get(); return q.docs.map(d=>({...d.data(), _id:d.id}))},
      async addSession(x){await sess.doc(x.id).set(x)},
      async delSession(id){await sess.doc(id).delete()}
    };
  }
  return {cloud:false,
    async loadPlan(){return LS.get('cr_plan')},
    async savePlan(p){LS.set('cr_plan',p)},
    async loadSessions(){return (LS.get('cr_sessions')||[]).sort((a,b)=>b.date.localeCompare(a.date))},
    async addSession(x){const a=LS.get('cr_sessions')||[]; a.push(x); LS.set('cr_sessions',a)},
    async delSession(id){LS.set('cr_sessions',(LS.get('cr_sessions')||[]).filter(s=>s.id!==id))}
  };
}

const hms = ms => {const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};

function lastFor(exId){
  for(const s of S.sessions){const e=(s.entries||[]).find(x=>x.exId===exId); if(e) return {s,e}}
  return null;
}
function suggestUp(ex,last){
  if(!last||ex.type!=='fuerza') return false;
  const top=topRep(ex.reps); if(!top) return false;
  const done=(last.e.sets||[]).filter(x=>x.done);
  return done.length>=ex.sets && done.every(x=>+x.r>=top);
}

// ---------- workout ----------
function startWorkout(key){
  const r=S.plan.routines[key];
  S.workout={id:uid('s'), key, name:r.name, started:Date.now(), entries:r.exercises.map(ex=>{
    const last=lastFor(ex.id);
    if(ex.type==='cardio'){
      const lc=last&&last.e.cardio;
      return {exId:ex.id,name:ex.name,type:'cardio',cardio:{min:lc?lc.min:'',dist:'',level:lc?lc.level:''},done:false};
    }
    const sets=[]; for(let i=0;i<ex.sets;i++){
      const ls=last&&last.e.sets&&last.e.sets[i];
      sets.push({w: ls? ls.w : (ex.weight||''), r:'', done:false, ph: ls? ls.r : topRep(ex.reps)||'', prev: ls? `${fmtKg(ls.w)} × ${ls.r}` : ''});
    }
    return {exId:ex.id,name:ex.name,type:'fuerza',sets};
  })};
  saveDraft(); render(); startClock();
}
function saveDraft(){ if(S.workout) LS.set('cr_draft',S.workout); else LS.del('cr_draft') }
async function finishWorkout(){
  const w=S.workout; const now=Date.now();
  const entries=w.entries.map(e=>e.type==='cardio'
    ? {exId:e.exId,name:e.name,type:'cardio',cardio:{min:+e.cardio.min||0,dist:+String(e.cardio.dist).replace(',','.')||0,level:+e.cardio.level||0}}
    : {exId:e.exId,name:e.name,type:'fuerza',sets:e.sets.filter(s=>s.done||s.r!=='').map(s=>({w:+String(s.w).replace(',','.')||0,r:+s.r||0,done:!!s.done}))}
  ).filter(e=>e.type==='cardio'? e.cardio.min>0 : e.sets.length>0);
  if(!entries.length){toast('Marcá al menos una serie'); S.confirmFinish=false; render(); return}
  const sess={id:w.id,date:new Date(w.started).toISOString(),routine:w.key,name:w.name,minutes:Math.round((now-w.started)/60000),entries};
  try{ await S.store.savePlan(S.plan); await S.store.addSession(sess); }
  catch(e){toast('No se pudo guardar. Probá de nuevo.'); return}
  S.sessions.unshift(sess); S.workout=null; S.confirmFinish=false; stopTimer(); stopClock(); saveDraft();
  toast('Entrenamiento guardado'); render(); window.scrollTo(0,0);
}

function tick(){
  const el=document.getElementById('timer');
  if(!S.timer){el.hidden=true;return}

function patternOf(ex){
  const n=(ex.name||'').toLowerCase();
  if(ex.type==='cardio') return 'rower';
  const R=[[/(gemelo|pantorr|calf).*prensa|prensa.*(gemelo|pantorr)/,'calfpress'],[/gemelo|pantorr|calf/,'calf'],[/cu[aá]driceps|extensi[oó]n de pierna/,'ext'],[/femoral|isquio/,'legcurl'],[/skull|franc[eé]s|rompecr/,'skull'],[/fondo|dips/,'dips'],[/pushdown|tr[ií]ceps|soga/,'tri'],[/dominad|jal[oó]n|pulldown/,'pull'],[/rear delt|face pull|p[aá]jaro|deltoide post/,'rdelt'],[/remo/,'row'],[/abduc/,'abd'],[/aduc/,'add'],[/hiperext|lumbar|rumano|peso muerto|hip thrust/,'hinge'],[/hack/,'hack'],[/prensa/,'legpress'],[/sentadilla|squat|zancada/,'squat'],[/predicador|scott/,'preacher'],[/martillo|hammer/,'hammer'],[/curl|b[ií]ceps/,'curl'],[/lateral|elevaci|militar/,'raise'],[/inclinad/,'incline'],[/apertura|pec ?deck|fly|cruce/,'fly'],[/press|banca|pecho/,'press']];
  for(const [re,p] of R) if(re.test(n)) return p;
  return 'curl';
}
const SPL='keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"';
function fig(ex,color){
  const f=FIG[patternOf(ex)]; const dur='2.4s';
  const pl=p=>`<polyline points="${p}"/>`;
  const ci=([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="currentColor" stroke="none"/>`;
  let s=(f.s||[]).map(pl).join('')+(f.c||[]).map(ci).join('')+(f.sm||[]).map(pl).join('');
  let a=(f.a||[]).map(([A,B])=>RM?pl(A):`<polyline points="${A}"><animate attributeName="points" values="${A};${B};${A}" dur="${dur}" repeatCount="indefinite" ${SPL}/></polyline>`).join('');
  a+=(f.ac||[]).map(([x1,y1,x2,y2,r])=>RM?ci([x1,y1,r]):`<circle cx="${x1}" cy="${y1}" r="${r}" fill="currentColor" stroke="none"><animate attributeName="cx" values="${x1};${x2};${x1}" dur="${dur}" repeatCount="indefinite" ${SPL}/><animate attributeName="cy" values="${y1};${y2};${y1}" dur="${dur}" repeatCount="indefinite" ${SPL}/></circle>`).join('');
  if(f.g){
    const inner=(f.m||[]).map(pl).join('')+(f.mc||[]).map(ci).join('')+a;
    a=`<g>${inner}${RM?'':`<animateTransform attributeName="transform" type="translate" values="${f.g}" dur="${dur}" repeatCount="indefinite" ${SPL}/>`}</g>`;
  }
  return `<svg class="fig" viewBox="0 0 64 64" aria-hidden="true" style="color:${color}" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">${s}${a}</svg>`;
}

  h+=w.entries.map((e,ei)=>{
    const ex=r.exercises.find(x=>x.id===e.exId)||{reps:'',rest:90};
    const last=lastFor(e.exId);
    if(e.type==='cardio'){
      return `<section class="ex"><div class="ex-h"><div class="ftile lg" style="${tileStyle(c)}">${fig(e,c)}</div><div class="row-main"><div class="row-title">${esc(e.name)}</div><div class="row-sub">Objetivo ${esc(ex.reps)} min</div><button class="vlink" data-act="tech" data-ex="${esc(e.exId)}">${IC_PLAY} Ver técnica 3D</button></div><button class="chk" aria-label="Hecho" aria-pressed="${!!e.done}" data-act="cdone" data-ei="${ei}">${IC.check}</button></div>
      <div class="cardio">
        <div class="field"><label for="c-${ei}-min">Minutos</label><input id="c-${ei}-min" inputmode="decimal" data-cf="min" data-ei="${ei}" value="${esc(e.cardio.min)}"></div>
        <div class="field"><label for="c-${ei}-dist">Distancia (km)</label><input id="c-${ei}-dist" inputmode="decimal" data-cf="dist" data-ei="${ei}" value="${esc(e.cardio.dist)}"></div>
        <div class="field"><label for="c-${ei}-level">Damper</label><input id="c-${ei}-level" inputmode="numeric" data-cf="level" data-ei="${ei}" value="${esc(e.cardio.level)}"></div>
      </div></section>`;
    }
    return `<section class="ex"><div class="ex-h"><div class="ftile lg" style="${tileStyle(c)}">${fig(e,c)}<span class="fnum">${ei+1}</span></div><div class="row-main"><div class="row-title">${esc(e.name)}</div><div class="row-sub">${esc(ex.reps)} reps · ${mmss(ex.rest)} de descanso</div><button class="vlink" data-act="tech" data-ex="${esc(e.exId)}">${IC_PLAY} Ver técnica 3D</button></div>${suggestUp(ex,last)?'<span class="badge up">Subí peso</span>':''}</div>
    <div class="tbl"><span class="th">Serie</span><span class="th">Anterior</span><span class="th">kg</span><span class="th">Reps</span><span class="th"></span>
    ${e.sets.map((s,si)=>`<div class="${s.done?'done':''}"><span class="n">${si+1}</span><span class="prev">${esc(s.prev||'—')}</span>
      <input id="w-${ei}-${si}" inputmode="decimal" aria-label="Peso serie ${si+1}" data-sf="w" data-ei="${ei}" data-si="${si}" value="${esc(s.w)}">
      <input id="r-${ei}-${si}" inputmode="numeric" aria-label="Repeticiones serie ${si+1}" placeholder="${esc(s.ph)}" data-sf="r" data-ei="${ei}" data-si="${si}" value="${esc(s.r)}">
      <button class="chk" aria-label="Serie ${si+1} hecha" aria-pressed="${s.done}" data-act="set" data-ei="${ei}" data-si="${si}">${IC.check}</button></div>`).join('')}

    <div class="ex-foot"><button class="btn sm text" data-act="addset" data-ei="${ei}">${IC.plus} Serie</button>${e.sets.length>1?`<button class="btn sm text" style="color:var(--fg-3)" data-act="rmset" data-ei="${ei}">${IC.minus} Quitar</button>`:''}</div></section>`;
  }).join('');
  if(!S.confirmFinish) h+=`<button class="btn ok block" data-act="finish">Terminar entrenamiento</button>`;
  return h;
}

function viewHist(){
  let h=`<header><div class="over">Tu progreso</div><h1>Progreso</h1></header>`;
  if(!S.sessions.length) return h+`<div class="empty">${IC.bar}<div><b style="color:var(--fg)">Todavía no hay entrenamientos</b><br>Cuando termines el primero, acá vas a ver tus series y cómo sube cada peso.</div></div>`;
  const wk=Date.now()-7*864e5;
  const thisWeek=S.sessions.filter(s=>new Date(s.date)>=wk);
  const vol=thisWeek.reduce((a,s)=>a+volOf(s),0);
  h+=`<div class="strip"><div><b>${thisWeek.length}</b><span>Esta semana</span></div><div><b>${fmtVol(vol)}</b><span>Volumen 7 días</span></div><div><b>${S.sessions.length}</b><span>Sesiones</span></div></div>`;
  const exs=[]; const seen=new Set();
  Object.values(S.plan.routines).forEach(r=>r.exercises.forEach(e=>{if(e.type==='fuerza'&&!seen.has(e.id)){seen.add(e.id);exs.push(e)}}));
  S.sessions.forEach(s=>s.entries.forEach(e=>{if(e.type==='fuerza'&&!seen.has(e.exId)){seen.add(e.exId);exs.push({id:e.exId,name:e.name})}}));
  const sel=S.progEx||(exs[0]&&exs[0].id);
  h+=`<section class="section"><div class="section-h"><h2>Por ejercicio</h2></div><div class="card"><div class="field"><label for="progsel">Ejercicio</label><select id="progsel" data-act="prog">${exs.map(e=>`<option value="${esc(e.id)}" ${e.id===sel?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>${chart(sel)}</div></section>`;
  h+=`<section class="section"><div class="section-h"><h2>Historial</h2><span>${S.sessions.length} sesiones</span></div><div class="group">`+S.sessions.map(s=>{
    const open=S.openSess===s.id, c=colorOf(s.routine);
    let body='';
    if(open){
      body=`<div class="detail">`+s.entries.map(e=>`<div><div class="t">${esc(e.name)}</div><div class="s">${e.type==='cardio'?`${e.cardio.min} min${e.cardio.dist?` · ${fmtKg(e.cardio.dist)} km`:''}${e.cardio.level?` · damper ${e.cardio.level}`:''}`:e.sets.map(x=>`${fmtKg(x.w)} × ${x.r}`).join(' &nbsp;·&nbsp; ')}</div></div>`).join('')+
      (S.confirmDel===s.id?`<div class="confirm"><span style="flex:1">¿Borrar esta sesión?</span><button class="btn sm danger" data-act="del2" data-id="${s.id}">Borrar</button><button class="btn sm" data-act="delno">Cancelar</button></div>`:`<button class="btn sm text danger" style="align-self:flex-start;padding:0" data-act="del" data-id="${s.id}">Borrar sesión</button>`)+`</div>`;
    }
    return `<div><button class="row" data-act="opens" data-id="${s.id}" aria-expanded="${open}"><div class="tile" style="${tileStyle(c)}"><span class="dot" style="background:${c};width:10px;height:10px"></span></div><div class="row-main"><div class="row-title">${esc(s.name)}</div><div class="row-sub">${fmtDate(s.date)} · ${s.minutes} min · ${fmtVol(volOf(s))}</div></div><span class="chev">${open?IC.chevd:IC.chev}</span></button>${body}</div>`;
  }).join('')+`</div></section>`;
  return h;
}

function chart(exId){
  const pts=S.sessions.slice().reverse().map(s=>{const e=s.entries.find(x=>x.exId===exId); if(!e||!e.sets||!e.sets.length) return null; const best=e.sets.reduce((a,x)=>x.w>a.w||(x.w===a.w&&x.r>a.r)?x:a,e.sets[0]); return {d:s.date,w:best.w,r:best.r}}).filter(Boolean).slice(-16);
  if(!pts.length) return `<div class="muted" style="font-size:.9rem;padding:8px 0">Sin datos de este ejercicio todavía.</div>`;
  const W=320,H=150,pl=34,pr=12,pt=14,pb=24;
  const ws=pts.map(p=>p.w); let lo=Math.min(...ws), hi=Math.max(...ws); if(lo===hi){lo=Math.max(0,lo-5);hi=hi+5}
  const x=i=>pts.length===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)},${H-pb} L${x(0).toFixed(1)},${H-pb} Z`;
  const last=pts[pts.length-1], first=pts[0], diff=last.w-first.w;
  const grid=[hi,(hi+lo)/2,lo].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmtKg(v)}</text>`).join('');
  return `<div class="kv"><div><b>${fmtKg(last.w)} kg × ${last.r}</b><span>Mejor serie reciente</span></div><div><b style="color:${diff>0?'var(--ok)':'var(--fg)'}">${diff>0?'+':''}${fmtKg(diff)} kg</b><span>Desde el inicio</span></div></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso de la mejor serie por sesión">${grid}
    <path d="${area}" fill="var(--accent)" fill-opacity=".14"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="${i===pts.length-1?5:2.6}" fill="var(--accent)" ${i===pts.length-1?'stroke="var(--surface)" stroke-width="2"':''}/>`).join('')}
    <text x="${pl}" y="${H-6}">${fmtDate(first.d)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtDate(last.d)}</text></svg>`;
}

function viewRut(){
  const keys=Object.keys(S.plan.routines);

  h+=`<div class="field"><label for="rname">Nombre de la rutina</label><input id="rname" data-ef="rname" value="${esc(d.name)}"></div>`;
  h+=`<section class="section"><div class="section-h"><h2>Ejercicios</h2><span>${d.exercises.length}</span></div>`+d.exercises.map((e,i)=>`<div class="ed">
    <div class="ed-h"><input id="en-${i}" aria-label="Nombre del ejercicio ${i+1}" data-ef="name" data-i="${i}" value="${esc(e.name)}">
      <button class="icon-btn" aria-label="Subir" data-act="up" data-i="${i}" ${i===0?'disabled':''}>${IC.up}</button>
      <button class="icon-btn" aria-label="Bajar" data-act="down" data-i="${i}" ${i===d.exercises.length-1?'disabled':''}>${IC.chevd}</button>
      <button class="icon-btn danger" aria-label="Quitar" data-act="rmex" data-i="${i}">${IC.x}</button></div>
    <div class="grid4">
      <div class="field"><label for="es-${i}">Series</label><input id="es-${i}" inputmode="numeric" data-ef="sets" data-i="${i}" value="${e.sets}"></div>
      <div class="field"><label for="er-${i}">${e.type==='cardio'?'Minutos':'Reps'}</label><input id="er-${i}" data-ef="reps" data-i="${i}" value="${esc(e.reps)}"></div>
      <div class="field"><label for="ew-${i}">kg</label><input id="ew-${i}" inputmode="decimal" data-ef="weight" data-i="${i}" value="${e.weight}"></div>
      <div class="field"><label for="et-${i}">Desc. (s)</label><input id="et-${i}" inputmode="numeric" data-ef="rest" data-i="${i}" value="${e.rest}"></div>
    </div>
    <div class="field"><label for="ey-${i}">Tipo</label><select id="ey-${i}" data-ef="type" data-i="${i}"><option value="fuerza" ${e.type==='fuerza'?'selected':''}>Fuerza · series y repeticiones</option><option value="cardio" ${e.type==='cardio'?'selected':''}>Cardio · minutos y distancia</option></select></div>
  </div>`).join('')+`<button class="btn" data-act="addex">${IC.plus} Agregar ejercicio</button></section>`;
  h+=`<div style="display:flex;gap:8px"><button class="btn primary" style="flex:1" data-act="esave">Guardar cambios</button><button class="btn" data-act="ereset">Descartar</button></div>`;
  h+=`<section class="section"><div class="section-h"><h2>Semana</h2></div><div class="group sched">${[1,2,3,4,5,6,0].map(dw=>`<div class="row"><label class="row-main row-title" for="sch-${dw}">${DAYNAMES[dw]}</label><select id="sch-${dw}" data-act="sched" data-d="${dw}"><option value="">Descanso</option>${keys.map(k=>`<option value="${k}" ${S.plan.schedule[dw]===k?'selected':''}>${esc(S.plan.routines[k].name)}</option>`).join('')}</select></div>`).join('')}</div></section>`;
  h+=backupSection();
  return h;
}

function render(){
  const app=document.getElementById('app');
  const f=document.activeElement&&document.activeElement.id;
  app.innerHTML = S.tab==='hoy'?viewHoy():S.tab==='hist'?viewHist():viewRut();

}



// ---------- respaldo ----------
const IS_PWA=!!window.__PWA, APP_VERSION=window.__APP_VERSION||'';
function backupJSON(){return JSON.stringify({app:'cuaderno-rutina',v:1,exportedAt:new Date().toISOString(),plan:S.plan,sessions:S.sessions.map(({_id,...r})=>r)})}
function backupSection(){
  let h=`<section class="section"><div class="section-h"><h2>Respaldo</h2><span>${S.sessions.length} sesiones</span></div><div class="card" style="gap:12px">`;
  h+=IS_PWA
    ? `<p class="muted" style="margin:0;font-size:.88rem">Tus datos se guardan en este celular. Descargá un respaldo de vez en cuando por si cambiás de teléfono o borrás los datos de Chrome.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="bk-export">Descargar respaldo</button><button class="btn" data-act="bk-copy">Copiar</button><button class="btn" data-act="bk-import">Importar</button></div>`
    : `<p class="muted" style="margin:0;font-size:.88rem">Para pasar tus rutinas y entrenamientos a la app instalada, copiá el respaldo y pegalo en la app nueva, en Rutinas → Respaldo → Importar.</p><button class="btn primary" data-act="bk-copy">Copiar respaldo</button>`;
  if(S.bkText!=null) h+=`<div class="field"><label for="bk-out">Respaldo (seleccioná y copiá)</label><textarea id="bk-out" rows="4" readonly style="font:12px ui-monospace,monospace;border:0;border-radius:10px;background:var(--surface-2);color:var(--fg);padding:10px">${esc(S.bkText)}</textarea></div>`;
  if(S.bkImport) h+=`<div class="field"><label for="bk-text">Pegá el respaldo o elegí el archivo</label><textarea id="bk-text" rows="4" style="font:12px ui-monospace,monospace;border:0;border-radius:10px;background:var(--surface-2);color:var(--fg);padding:10px"></textarea><input type="file" id="bk-file" accept=".json,application/json,text/plain" style="font-size:.85rem;color:var(--fg-2)"></div><div style="display:flex;gap:8px"><button class="btn primary" data-act="bk-do">Importar</button><button class="btn" data-act="bk-cancel">Cancelar</button></div>`;
  h+=`</div>${APP_VERSION?`<div class="note">Versión ${esc(APP_VERSION)}</div>`:''}</section>`;
  return h;
}
async function backupImport(txt){
  let d; try{d=JSON.parse(txt)}catch(e){toast('El texto no es un respaldo válido'); return}
  if(!d||d.app!=='cuaderno-rutina'||!Array.isArray(d.sessions)){toast('El texto no es un respaldo de esta app'); return}
  const have=new Set(S.sessions.map(x=>x.id)); let n=0;
  try{
    if(d.plan&&d.plan.routines){S.plan=d.plan; if((S.plan.planVersion||1)<DEFAULT.planVersion) S.plan.planVersion=DEFAULT.planVersion; await S.store.savePlan(S.plan)}
    for(const x of d.sessions){if(!x||!x.id||have.has(x.id)) continue; await S.store.addSession(x); S.sessions.push(x); n++}
  }catch(e){toast('No se pudo importar todo. Probá de nuevo.'); return}
  S.sessions.sort((a,b)=>b.date.localeCompare(a.date)); S.bkImport=false; S.editDraft=null; render();
  toast(n?`Importadas ${n} sesiones`:'Rutinas importadas');
}

// ---------- hoja de técnica 3D ----------
const TECH={eng:null,loading:null,open:false};
function findEx(id){
  for(const r of Object.values(S.plan.routines)){const e=r.exercises.find(x=>x.id===id); if(e) return e}
  if(S.workout){const e=S.workout.entries.find(x=>x.exId===id); if(e) return {id,name:e.name,type:e.type}}
  for(const s of S.sessions){const e=(s.entries||[]).find(x=>x.exId===id); if(e) return {id,name:e.name,type:e.type}}
  return null;
}
async function openTech(id){
  const ex=findEx(id); if(!ex) return;
  const sh=document.getElementById('sheet'), msg=document.getElementById('sheet-msg'), stage=document.getElementById('sheet-stage');
  const A=window.Anim3D, aid=A?A.match(ex):null, m=aid?A.meta(aid):null;
  document.getElementById('sheet-title').textContent=ex.name;
  document.getElementById('sheet-yt').href=ytLink(ex.name);
  document.getElementById('sheet-info').innerHTML=m?`<div class="tags">${m.main.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}${m.sec.map(x=>`<span class="tag b">${esc(x)}</span>`).join('')}</div><p>${esc(m.cue)}</p><ol>${m.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'';
  sh.hidden=false; TECH.open=true; document.body.style.overflow='hidden';
  if(!m){msg.hidden=false; msg.textContent='Todavía no hay animación 3D para este ejercicio. Podés ver la técnica en video.'; if(TECH.eng) TECH.eng.stop(); return}
  msg.hidden=false; msg.textContent=TECH.eng?'':'Cargando cuerpo 3D…'; if(TECH.eng) msg.hidden=true;
  try{
    if(!TECH.eng){TECH.loading=TECH.loading||A.mount(stage); TECH.eng=await TECH.loading}
    if(!TECH.open) return;
    msg.hidden=true; TECH.eng.show(aid); TECH.eng.start();
  }catch(e){TECH.loading=null; msg.hidden=false; msg.textContent='No se pudo cargar la animación. Revisá la conexión y volvé a intentar.'}
}
function closeTech(){document.getElementById('sheet').hidden=true; TECH.open=false; document.body.style.overflow=''; if(TECH.eng) TECH.eng.stop()}
document.getElementById('sheet-close').addEventListener('click',closeTech);
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet') closeTech()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&TECH.open) closeTech()});

// ---------- events ----------
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){S.tab=t.dataset.tab; S.confirmDel=null; render(); window.scrollTo(0,0); return}
  const a=t.dataset.act, ei=+t.dataset.ei, si=+t.dataset.si, i=+t.dataset.i;
  const W=S.workout;
  switch(a){
    case 'tech': openTech(t.dataset.ex); break;
    case 'bk-copy': {const txt=backupJSON(); try{await navigator.clipboard.writeText(txt); toast('Respaldo copiado'); S.bkText=null}catch(e){S.bkText=txt; toast('Copialo desde el cuadro de abajo')} render(); break}
    case 'bk-export': {try{const b=new Blob([backupJSON()],{type:'application/json'}), u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download='respaldo-rutina-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast('Respaldo descargado')}catch(e){toast('No se pudo descargar. Usá Copiar.')} break}
    case 'bk-import': S.bkImport=true; S.bkText=null; render(); break;
    case 'bk-cancel': S.bkImport=false; render(); break;
    case 'bk-do': {const el=document.getElementById('bk-text'); await backupImport(el?el.value:''); break}
    case 'pick': S.pick=t.dataset.k; render(); break;
    case 'start': startWorkout(t.dataset.k); window.scrollTo(0,0); break;
    case 'set': {const s=W.entries[ei].sets[si]; s.done=!s.done; if(s.done&&s.r==='') s.r=s.ph||''; saveDraft(); render();
      if(s.done){const ex=(S.plan.routines[W.key].exercises.find(x=>x.id===W.entries[ei].exId)||{rest:90}); startTimer(ex.rest)} break}
    case 'addset': {const ss=W.entries[ei].sets, l=ss[ss.length-1]; ss.push({w:l?l.w:'',r:'',done:false,ph:l?l.ph:'',prev:''}); saveDraft(); render(); break}
    case 'rmset': W.entries[ei].sets.pop(); saveDraft(); render(); break;
    case 'cdone': W.entries[ei].done=!W.entries[ei].done; saveDraft(); render(); break;
    case 'finish': S.confirmFinish=true; render(); window.scrollTo(0,0); break;
    case 'finishno': S.confirmFinish=false; render(); break;
    case 'finish2': await finishWorkout(); break;
    case 'discard': S.workout=null; S.confirmFinish=false; stopTimer(); stopClock(); saveDraft(); toast('Entrenamiento descartado'); render(); break;
    case 't+': if(S.timer){S.timer.end+=15000; S.timer.total+=15; tick()} break;
    case 't-': if(S.timer){S.timer.end-=15000; tick()} break;
    case 'tskip': stopTimer(); break;
    case 'opens': S.openSess=S.openSess===t.dataset.id?null:t.dataset.id; S.confirmDel=null; render(); break;
    case 'del': S.confirmDel=t.dataset.id; render(); break;
    case 'delno': S.confirmDel=null; render(); break;
    case 'del2': try{await S.store.delSession(t.dataset.id); S.sessions=S.sessions.filter(s=>s.id!==t.dataset.id); toast('Sesión borrada')}catch(e){toast('No se pudo borrar. Probá de nuevo.')} S.confirmDel=null; render(); break;
    case 'ekey': S.editKey=t.dataset.k; S.editDraft=null; render(); break;
    case 'up': case 'down': {const ex=S.editDraft.exercises, j=a==='up'?i-1:i+1; [ex[i],ex[j]]=[ex[j],ex[i]]; render(); break}
    case 'rmex': S.editDraft.exercises.splice(i,1); render(); break;
    case 'addex': S.editDraft.exercises.push({id:uid('e'),name:'Nuevo ejercicio',type:'fuerza',sets:3,reps:'10-12',weight:0,rest:90}); render(); break;
    case 'ereset': S.editDraft=null; render(); toast('Cambios descartados'); break;
    case 'esave': S.plan.routines[S.editKey]=JSON.parse(JSON.stringify(S.editDraft)); try{await S.store.savePlan(S.plan); toast('Rutina guardada')}catch(e){toast('No se pudo guardar. Probá de nuevo.')} render(); break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target, W=S.workout;
  if(t.dataset.sf&&W){W.entries[+t.dataset.ei].sets[+t.dataset.si][t.dataset.sf]=t.value; saveDraft()}
  else if(t.dataset.cf&&W){W.entries[+t.dataset.ei].cardio[t.dataset.cf]=t.value; saveDraft()}
  else if(t.dataset.ef&&S.editDraft){
    const f=t.dataset.ef;
    if(f==='rname'){S.editDraft.name=t.value;return}
    const e=S.editDraft.exercises[+t.dataset.i];
    if(f==='sets'||f==='rest') e[f]=Math.max(0,parseInt(t.value)||0);
    else if(f==='weight') e[f]=parseFloat(String(t.value).replace(',','.'))||0;
    else e[f]=t.value;
  }
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='bk-file'&&t.files&&t.files[0]){const r=new FileReader(); r.onload=()=>{const el=document.getElementById('bk-text'); if(el) el.value=r.result}; r.readAsText(t.files[0]); return}
  if(t.dataset.act==='prog'){S.progEx=t.value; render()}
  else if(t.dataset.ef==='type'){render()}
  else if(t.dataset.act==='sched'){if(t.value) S.plan.schedule[t.dataset.d]=t.value; else delete S.plan.schedule[t.dataset.d]; try{await S.store.savePlan(S.plan); toast('Semana actualizada')}catch(e){toast('No se pudo guardar. Probá de nuevo.')}}
});

// ---------- boot ----------
(async()=>{
  S.plan=JSON.parse(JSON.stringify(DEFAULT));
  S.store={cloud:null}; S.workout=LS.get('cr_draft'); render();
  S.store=await makeStore(); S.store.ready=true;
  try{
    const p=await S.store.loadPlan();
    if(p){
      S.plan=p;
      if((p.planVersion||1)<DEFAULT.planVersion){
        S.plan.routines.piernas=JSON.parse(JSON.stringify(DEFAULT.routines.piernas));
        S.plan.planVersion=DEFAULT.planVersion;
        try{await S.store.savePlan(S.plan); setTimeout(()=>toast('Rutina de piernas actualizada'),400)}catch(e){}
      }
    }
  }catch(e){}
  try{S.sessions=await S.store.loadSessions()}catch(e){S.sessions=[]}
  S.editDraft=null; render();
  if(S.workout){ startClock(); toast('Retomaste el entrenamiento'); }
  // precarga el visor 3D en segundo plano para que la técnica abra rápido
  setTimeout(()=>{try{const c=navigator.connection; if(window.Anim3D && !(c&&c.saveData)) Anim3D.load().catch(()=>{})}catch(e){}},2500);
})();
})();
</script>

<script>
// app instalada: funciona sin conexión y avisa cuando hay versión nueva
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const show=w=>{const el=document.getElementById('upd'); el.hidden=false; el.querySelector('button').onclick=()=>{el.hidden=true; w.postMessage('skip')}};
      if(reg.waiting&&navigator.serviceWorker.controller) show(reg.waiting);
      reg.addEventListener('updatefound',()=>{const w=reg.installing; if(!w) return; w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller) show(w)})});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') reg.update().catch(()=>{})});
    }).catch(()=>{});
    let done=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{if(done) return; done=true; location.reload()});
  });
}
</script>
