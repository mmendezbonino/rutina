name: App Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle -p android assembleRelease -Pvc=${{ github.run_number }} --no-daemon
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cuaderno-rutina.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk cuaderno-rutina.apk --title "App Android (build ${{ github.run_number }})" --notes "Descargá cuaderno-rutina.apk desde el celular e instalala." --latest
